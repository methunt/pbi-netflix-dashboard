<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112"
     width="1200" height="112" role="img" aria-label="Part 2 - Making it answerable">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="112" rx="12" fill="#F6F8FA"/>
  <rect width="1200" height="112" rx="12" fill="url(#w)"/>
  <rect width="6" height="112" rx="3" fill="#0891B2"/>
  <g class="rise">
  <text x="40" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22"
        fill="#656D76">Three columns held lists, not values. Splitting them turns a spreadsheet into something you can ask</text>
  <text x="40" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22"
        fill="#656D76">questions of.</text>
  </g>
</svg>
