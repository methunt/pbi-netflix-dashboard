<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"
     width="1200" height="600" role="img"
     aria-label="Model shape: one Kaggle CSV feeds a shared Power Query expression called NetflixSource, which feeds two tables - Netflix, a 23,760-row bridge with genre and country split out, and Dim Title, a 8,804-row table at one row per title. A separate Date calendar joins the bridge on Date Added.">
  <style>
    .rise { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    .flow { stroke-dasharray: 7 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26 } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .flow { animation: none }
    }
  </style>

  <text x="40" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700"
        fill="#1F2328">One CSV, one shared query, two grains and a calendar</text>
  <text x="40" y="76" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16"
        fill="#656D76">Splitting the list columns is what makes the questions answerable.</text>

  
  <g class="rise" style="animation-delay:0.10s">
    <rect x="40" y="210" width="300" height="195" rx="10"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="40" y="210" width="300" height="4" rx="2" fill="#656D76"/>
    <text x="58" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.5"
          font-weight="700" fill="#1F2328">netflix_titles.csv</text>
    <text x="58" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#656D76">8,807 rows  ·  12 columns</text>
    <text x="58" y="290" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">show_id, type, title</text><text x="58" y="313" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">director, cast, country</text><text x="58" y="336" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">date_added, release_year</text><text x="58" y="359" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">rating, duration</text><text x="58" y="382" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">listed_in, description</text>
  </g>
  
  <g class="rise" style="animation-delay:0.22s">
    <rect x="380" y="110" width="300" height="195" rx="10"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="380" y="110" width="300" height="4" rx="2" fill="#0891B2"/>
    <text x="398" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.5"
          font-weight="700" fill="#1F2328">NetflixSource</text>
    <text x="398" y="165" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#656D76">shared query  ·  cleansed once</text>
    <text x="398" y="190" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">drop 3 bad-rating rows</text><text x="398" y="213" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">parse date_added</text><text x="398" y="236" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">strip the 's' from show_id</text><text x="398" y="259" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">rename to business names</text><text x="398" y="282" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">trim list columns</text>
  </g>
  
  <g class="rise" style="animation-delay:0.34s">
    <rect x="380" y="345" width="300" height="149" rx="10"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="380" y="345" width="300" height="4" rx="2" fill="#059669"/>
    <text x="398" y="377" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.5"
          font-weight="700" fill="#1F2328">Date</text>
    <text x="398" y="400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#656D76">calendar  ·  its own query</text>
    <text x="398" y="425" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">Date  ·  Year  ·  Quarter</text><text x="398" y="448" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">Month  ·  Month Name  ·  Day</text><text x="398" y="471" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">marked as the date table</text>
  </g>
  
  <g class="rise" style="animation-delay:0.46s">
    <rect x="720" y="100" width="440" height="172" rx="10"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="720" y="100" width="440" height="4" rx="2" fill="#E50914"/>
    <text x="738" y="132" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.5"
          font-weight="700" fill="#1F2328">Netflix</text>
    <text x="738" y="155" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#656D76">bridge grain  ·  23,760 rows</text>
    <text x="738" y="180" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">one row per title x genre x country</text><text x="738" y="203" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">Genre, Country  &lt;- split from lists</text><text x="738" y="226" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">Type, Rating, Director, Title</text><text x="738" y="249" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">Date Added  -&gt; Date[Date]</text>
  </g>
  
  <g class="rise" style="animation-delay:0.58s">
    <rect x="720" y="330" width="440" height="149" rx="10"
          fill="#F6F8FA" stroke="#D0D7DE"/>
    <rect x="720" y="330" width="440" height="4" rx="2" fill="#7C3AED"/>
    <text x="738" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18.5"
          font-weight="700" fill="#1F2328">Dim Title</text>
    <text x="738" y="385" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15"
          fill="#656D76">title grain  ·  8,804 rows</text>
    <text x="738" y="410" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">one row per title, nothing split</text><text x="738" y="433" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">Cast, Release Year, Title, Type</text><text x="738" y="456" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="15.5" fill="#656D76">ID  &lt;- joined from Netflix</text>
  </g>

  <g stroke="#8C959F" stroke-width="2" fill="none" opacity="0.85">
    <path class="flow" d="M340 308 H360 V208 H380"/>
    <path class="flow" d="M680 208 H700 V186 H720"/>
    <path class="flow" d="M680 208 H700 V404 H720"/>
    <path class="flow" d="M680 420 H694 V230 H720"/>
  </g>

  <g class="rise" style="animation-delay:0.70s">
    <rect x="722" y="493" width="436" height="28" rx="14"
          fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-opacity="0.5"/>
    <text x="940" y="512" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace"
          font-size="15" fill="#1F2328">Netflix[ID]  many : 1  Dim Title[ID]</text>
  </g>

  <g class="rise" style="animation-delay:0.78s">
    <rect x="722" y="527" width="436" height="28" rx="14"
          fill="#059669" fill-opacity="0.10" stroke="#059669" stroke-opacity="0.5"/>
    <text x="940" y="546" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace"
          font-size="15" fill="#1F2328">Netflix[Date Added]  many : 1  Date[Date]</text>
  </g>
</svg>
